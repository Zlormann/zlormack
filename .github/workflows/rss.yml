
name: Actualiser le flux RSS

on:
  push:
    branches: [main]
    paths:
      - 'index.json'
      - 'wallpapers/**'
      - 'cartes-gratuites/**'
      - 'outils/generer_rss.py'
      - '.github/workflows/rss.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Générer feed.xml
        run: python outils/generer_rss.py

      - name: Enregistrer le flux mis à jour
        run: |
          if ! git diff --quiet -- feed.xml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add feed.xml
            git commit -m 'Mise à jour automatique du flux RSS'
            git push
          fi
